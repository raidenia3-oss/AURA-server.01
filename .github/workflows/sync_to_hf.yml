name: Sync to Hugging Face Spaces

on:
  push:
    branches:
      - main

jobs:
  sync-to-hf:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config --global user.email "ci@aura.local"
          git config --global user.name "AURA CI"

      - name: Force sync to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          # Clone the target HF Space using the token as password
          git clone "https://raiden456:${HF_TOKEN}@huggingface.co/spaces/raiden456/slut" hf_space

          # Clean working tree of the Space and copy the full GitHub repo into it
          cd hf_space
          rm -rf ./* ./.[!.]* 2>/dev/null || true
          shopt -s dotglob
          cp -r ../* . 2>/dev/null || true
          shopt -u dotglob

          git add -A
          git commit -m "Sync from GitHub main (auto)" || echo "Nothing to commit"
          git push --force "https://raiden456:${HF_TOKEN}@huggingface.co/spaces/raiden456/slut" main
