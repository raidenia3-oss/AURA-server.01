name: AURA/AME Auto Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend-checks:
    name: Frontend (typecheck + lint + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: |
          cd frontend
          npm install

      - name: Typecheck (local tsconfig shim)
        run: |
          cd frontend
          npm run typecheck

      - name: Lint (local config)
        run: |
          cd frontend
          npm run lint:local

      - name: Test
        run: |
          cd frontend
          npm test

  backend-checks:
    name: Backend (compile + health)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend deps
        run: |
          python -m pip install --upgrade pip
          pip install -r ame_backend/requirements.txt

      - name: Compile Python sources
        run: |
          python -m compileall ame_backend/src -q

      - name: Smoke-test backend health
        run: |
          python -m ame_backend.src.main &
          SERVER_PID=$!
          for i in $(seq 1 20); do
            if curl -sf http://localhost:8000/health > /dev/null; then
              echo "health OK"; break
            fi
            sleep 1
          done
          curl -sf http://localhost:8000/health
          curl -sf http://localhost:8000/api/admin/servers
          kill $SERVER_PID || true

  deploy:
    name: Deploy to Vercel
    needs: [frontend-checks, backend-checks]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Vercel CLI
        run: npm install -g vercel

      # Vercel builds the frontend on its side with a modern Next version.
      # We do NOT run `next build` locally here because the pinned next@9
      # cannot build the App Router code (see LOCALHOST_SETUP.md).
      - name: Deploy to Vercel
        run: |
          cd frontend
          vercel deploy --prod --token=${{ secrets.VERCEL_TOKEN }} --yes
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
