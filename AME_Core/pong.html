<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Pong Cyberpunk</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #050505;
            color: #0ff;
            font-family: 'Courier New', Courier, monospace;
            overflow: hidden;
        }

        #game-container {
            position: relative;
            border: 4px solid #0ff;
            box-shadow: 0 0 20px #0ff, inset 0 0 20px #0ff;
            border-radius: 10px;
        }

        canvas {
            display: block;
            background-color: #000;
        }

        #ui {
            position: absolute;
            top: -60px;
            width: 100%;
            display: flex;
            justify-content: space-between;
            font-size: 2rem;
            text-transform: uppercase;
            letter-spacing: 5px;
            text-shadow: 0 0 10px #0ff;
        }

        .controls-hint {
            position: absolute;
            bottom: -40px;
            width: 100%;
            text-align: center;
            font-size: 0.8rem;
            color: #f0f;
            text-shadow: 0 0 5px #f0f;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <div id="ui">
            <div id="playerScore">Player: 0</div>
            <div id="cpuScore">CPU: 0</div>
        </div>
        <canvas id="pongCanvas" width="800" height="500"></canvas>
        <div class="controls-hint">Usa las flechas ↑ ↓ para moverte</div>
    </div>

    <script>
        const canvas = document.getElementById('pongCanvas');
        const ctx = canvas.getContext('2d');
        const playerScoreElem = document.getElementById('playerScore');
        const cpuScoreElem = document.getElementById('cpuScore');

        // Game settings
        const paddleWidth = 10;
        const paddleHeight = 80;
        const ballSize = 8;
        let playerScore = 0;
        let cpuScore = 0;

        // Player object
        const player = {
            x: 0,
            y: canvas.height / 2 - paddleHeight / 2,
            width: paddleWidth,
            height: paddleHeight,
            color: '#0ff',
            dy: 0,
            speed: 8
        };

        // CPU object
        const cpu = {
            x: canvas.width - paddleWidth,
            y: canvas.height / 2 - paddleHeight / 2,
            width: paddleWidth,
            height: paddleHeight,
            color: '#f0f',
            speed: 4.5
        };

        // Ball object
        const ball = {
            x: canvas.width / 2,
            y: canvas.height / 2,
            radius: ballSize,
            speed: 5,
            dx: 5,
            dy: 5,
            color: '#fff'
        };

        // Input handling
        const keys = {};
        window.addEventListener('keydown', e => keys[e.code] = true);
        window.addEventListener('keyup', e => keys[e.code] = false);

        function resetBall() {
            ball.x = canvas.width / 2;
            ball.y = canvas.height / 2;
            ball.speed = 5;
            ball.dx = -ball.dx; // Serve to the winner
            ball.dy = (Math.random() > 0.5 ? 1 : -1) * ball.speed;
        }

        function update() {
            // Player move
            if (keys['ArrowUp'] && player.y > 0) player.y -= player.speed;
            if (keys['ArrowDown'] && player.y < canvas.height - player.height) player.y += player.speed;

            // CPU move (Simple AI)
            const cpuCenter = cpu.y + cpu.height / 2;
            if (cpuCenter < ball.y - 10) cpu.y += cpu.speed;
            else if (cpuCenter > ball.y + 10) cpu.y -= cpu.speed;

            // Ball move
            ball.x += ball.dx;
            ball.y += ball.dy;

            // Wall collision (top/bottom)
            if (ball.y - ball.radius < 0 || ball.y + ball.radius > canvas.height) {
                ball.dy *= -1;
            }

            // Paddle collision
            let currentPaddle = (ball.x < canvas.width / 2) ? player : cpu;

            if (checkCollision(ball, currentPaddle)) {
                // Calculate hit angle based on where it hit the paddle
                let collidePoint = (ball.y - (currentPaddle.y + currentPaddle.height/2));
                collidePoint = collidePoint / (currentPaddle.height/2);
                
                let angleRad = (Math.PI/4) * collidePoint;
                let direction = (ball.x < canvas.width/2) ? 1 : -1;

                ball.dx = direction * ball.speed * Math.cos(angleRad);
                ball.dy = ball.speed * Math.sin(angleRad);

                // Increase speed gradually
                ball.speed += 0.2;
            }

            // Scoring
            if (ball.x < 0) {
                cpuScore++;
                cpuScoreElem.innerText = `CPU: ${cpuScore}`;
                resetBall();
            } else if (ball.x > canvas.width) {
                playerScore++;
                playerScoreElem.innerText = `Player: ${playerScore}`;
                resetBall();
            }
        }

        function checkCollision(b, p) {
            return b.x + b.radius > p.x && b.x - b.radius < p.x + p.width &&
                   b.y + b.radius > p.y && b.y - b.radius < p.y + p.height;
        }

        function draw() {
            // Clear canvas
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw center line
            ctx.strokeStyle = 'rgba(0, 255, 255, 0.2)';
            ctx.setLineDash([10, 10]);
            ctx.beginPath();
            ctx.moveTo(canvas.width / 2, 0);
            ctx.lineTo(canvas.width / 2, canvas.height);
            ctx.stroke();
            ctx.setLineDash([]);

            // Draw player paddle
            ctx.fillStyle = player.color;
            ctx.shadowBlur = 15;
            ctx.shadowColor = player.color;
            ctx.fillRect(player.x, player.y, player.width, player.height);

            // Draw CPU paddle
            ctx.fillStyle = cpu.color;
            ctx.shadowBlur = 15;
            ctx.shadowColor = cpu.color;
            ctx.fillRect(cpu.x, cpu.y, cpu.width, cpu.height);

            // Draw ball
            ctx.fillStyle = ball.color;
            ctx.shadowBlur = 10;
            ctx.shadowColor = '#fff';
            ctx.beginPath();
            ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
            ctx.fill();
            
            ctx.shadowBlur = 0; // Reset shadow for next frame
        }

        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        gameLoop();
    </script>
</body>
</html>
