<!doctype html>
<html lang="es">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>AURA - Offline</title>
        <style>
            body {
                font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
                background-color: #1a1a2e;
                color: #e0e0e0;
                display: flex;
                justify-content: center;
                align-items: center;
                min-height: 100vh;
                margin: 0;
                text-align: center;
            }
            .container {
                padding: 20px;
                border-radius: 10px;
                background-color: #16213e;
                box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
                max-width: 500px;
                width: 90%;
            }
            h1 {
                color: #e94560;
                margin-bottom: 10px;
            }
            p {
                font-size: 1.1em;
                line-height: 1.6;
            }
            .icon {
                width: 100px;
                height: 100px;
                margin-bottom: 20px;
            }
        </style>
    </head>
    <body>
        <div class="container">
            <img src="/static/images/aura-icon-192x192.png" alt="AURA Icon" class="icon" />
            <h1>Sin Conexión a la Red</h1>
            <p>
                Parece que no tienes conexión a Internet. Por favor, verifica tu conexión e
                inténtalo de nuevo.
            </p>
            <p>
                La aplicación AME AURA está diseñada para funcionar offline en la medida de lo
                posible, pero algunas funciones requieren acceso a la red.
            </p>
        </div>
    </body>
</html>
