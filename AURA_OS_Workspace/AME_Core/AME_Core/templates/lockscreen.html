<!doctype html>
<html lang="es">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>AURA - Acceso Bloqueado</title>
        <link rel="stylesheet" href="../static/css/lock_screen.css" />
        <script type="module">
            import { initAuth } from "../static/js/webauthnAuth.js";
            window.initAuth = initAuth;
        </script>
    </head>
    <body>
        <div class="lock-container">
            <div class="lock-logo">
                <h1 style="font-size: 48px; margin: 0">🔐</h1>
            </div>
            <div class="lock-message">
                <h1>Acceso Bloqueado</h1>
                <p>Su sesión ha expirado o no se pudo validar la autenticación.</p>
                <p>Por favor autentíquese con su huella, rostro o PIN.</p>
            </div>
            <div class="lock-button-container">
                <button id="retryAuth" class="lock-button">Autenticarse</button>
            </div>
        </div>
        <script type="module">
            document.getElementById("retryAuth").addEventListener("click", async () => {
                const token = await window.initAuth();
                if (token) window.location.href = "/dashboard.html";
            });
        </script>
    </body>
</html>
