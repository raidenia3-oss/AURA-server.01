name: CI/CD - AURA Deploy

on:
    push:
        branches: [main]
    workflow_dispatch:

jobs:
    lint-and-test:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.11"

            - name: Install Python dependencies
              run: |
                  python -m pip install --upgrade pip
                  pip install flake8 black

            - name: Lint Python
              run: |
                  flake8 AURA_Core --max-line-length=120 --ignore=E203,W503
                  black --check AURA_Core

    build-frontend:
        runs-on: ubuntu-latest
        needs: lint-and-test
        defaults:
            run:
                working-directory: aura-ui
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Set up Node
              uses: actions/setup-node@v4
              with:
                  node-version: "20"
                  cache: "npm"
                  cache-dependency-path: aura-ui/package-lock.json

            - name: Install dependencies
              run: npm ci

            - name: Build React app
              run: npm run build

    docker-test:
        runs-on: ubuntu-latest
        needs: build-frontend
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Build backend image
              uses: docker/build-push-action@v5
              with:
                  context: .
                  file: backend.Dockerfile
                  push: false
                  tags: aura-backend:test

            - name: Build frontend image
              uses: docker/build-push-action@v5
              with:
                  context: .
                  file: frontend.Dockerfile
                  push: false
                  tags: aura-frontend:test

    deploy:
        runs-on: ubuntu-latest
        needs: docker-test
        if: github.ref == 'refs/heads/main'
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Deploy via SSH
              uses: appleboy/ssh-action@v1.0.3
              with:
                  host: ${{ secrets.SERVER_HOST }}
                  username: ${{ secrets.SERVER_USER }}
                  key: ${{ secrets.SERVER_SSH_KEY }}
                  script: |
                      cd /opt/aura
                      git pull origin main
                      docker compose up -d --build
