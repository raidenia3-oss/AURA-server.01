[package]
name = "aura-desktop"
version = "0.1.0"
description = "AURA Desktop Client"
authors = ["AURA Team"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[dependencies]
tauri = { version = "1.5", features = ["system-tray", "shell-open"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri-plugin-positioner = "0.1.0"
tauri-plugin-single-instance = "0.1.0"