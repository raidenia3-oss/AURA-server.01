<!doctype html>
<html lang="es">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Orb CPU</title>
        <style>
            html,
            body {
                margin: 0;
                width: 100%;
                height: 100%;
                overflow: hidden;
                background: radial-gradient(circle at top, #111827 0%, #03050a 70%, #010205 100%);
                font-family:
                    Segoe UI,
                    Roboto,
                    Arial,
                    sans-serif;
                color: #e5e7eb;
            }

            #hud {
                position: fixed;
                top: 16px;
                left: 16px;
                padding: 10px 14px;
                border: 1px solid rgba(255, 255, 255, 0.12);
                background: rgba(3, 5, 10, 0.72);
                backdrop-filter: blur(8px);
                border-radius: 999px;
                font-size: 14px;
                letter-spacing: 0.04em;
                z-index: 10;
                box-shadow: 0 0 20px rgba(0, 0, 0, 0.35);
            }

            canvas {
                display: block;
            }
        </style>
    </head>
    <body>
        <div id="hud">Uso de CPU: <strong id="cpuValue">0%</strong></div>

        <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
        <script>
            const scene = new THREE.Scene();
            scene.background = new THREE.Color(0x03050a);

            const camera = new THREE.PerspectiveCamera(
                60,
                window.innerWidth / window.innerHeight,
                0.1,
                1000,
            );
            camera.position.set(0, 0, 6);

            const renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);

            const ambientLight = new THREE.AmbientLight(0xffffff, 0.35);
            scene.add(ambientLight);

            const pointLight = new THREE.PointLight(0x38bdf8, 2.3, 20);
            pointLight.position.set(2, 2, 5);
            scene.add(pointLight);

            const group = new THREE.Group();
            scene.add(group);

            const orbGeometry = new THREE.IcosahedronGeometry(1.1, 2);
            const orbMaterial = new THREE.MeshPhysicalMaterial({
                color: 0x22d3ee,
                emissive: 0x103c5d,
                emissiveIntensity: 1.05,
                roughness: 0.14,
                metalness: 0.28,
                clearcoat: 1.0,
                clearcoatRoughness: 0.16,
            });
            const orb = new THREE.Mesh(orbGeometry, orbMaterial);
            group.add(orb);

            const glowGeometry = new THREE.IcosahedronGeometry(1.35, 1);
            const glowMaterial = new THREE.MeshBasicMaterial({
                color: 0x3b82f6,
                transparent: true,
                opacity: 0.12,
                side: THREE.BackSide,
            });
            const glow = new THREE.Mesh(glowGeometry, glowMaterial);
            group.add(glow);

            const clock = new THREE.Clock();
            let lastTime = performance.now();
            let cpuUsage = 0;

            function updateCpuUsage() {
                const now = performance.now();
                const frameTime = now - lastTime;
                lastTime = now;

                const targetFrame = 1000 / 60;
                const loadRatio = Math.min(
                    1,
                    Math.max(0, (frameTime - targetFrame) / (targetFrame * 0.8)),
                );
                cpuUsage = cpuUsage * 0.84 + loadRatio * 100;
                return cpuUsage;
            }

            function animate() {
                requestAnimationFrame(animate);

                const usage = updateCpuUsage();
                const hue = THREE.MathUtils.lerp(0.55, 0.02, Math.min(1, usage / 100));
                const pulse = 0.96 + Math.sin(clock.elapsedTime * 2.2) * 0.04;

                const color = new THREE.Color().setHSL(hue, 0.92, 0.6);
                orbMaterial.color.copy(color);
                orbMaterial.emissive.copy(color.clone().multiplyScalar(0.34));
                pointLight.color.copy(color);
                glowMaterial.color.copy(color.clone().multiplyScalar(0.8));

                group.rotation.y += 0.006;
                group.rotation.x += 0.003;
                orb.scale.setScalar(pulse);
                glow.scale.setScalar(1.12 + Math.sin(clock.elapsedTime * 1.8) * 0.03);

                renderer.render(scene, camera);
                document.getElementById("cpuValue").textContent = `${Math.round(usage)}%`;
            }

            window.addEventListener("resize", () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });

            animate();
        </script>
    </body>
</html>
