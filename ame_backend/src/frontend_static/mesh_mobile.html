<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<title>AmeAura · Private Mesh</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  :root{
    --bg:#0a0a16; --panel:#11112a; --neon:#00d4ff; --violet:#7b2ff7;
    --ok:#00ff88; --warn:#ff4444; --txt:#e0e0ff;
  }
  body{
    background:var(--bg); color:var(--txt); height:100vh; overflow:hidden;
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    display:flex; flex-direction:column;
  }
  header{
    padding:14px 16px; background:linear-gradient(135deg,#14143a,#1a0a2a);
    border-bottom:1px solid #2a2a4e; display:flex; align-items:center; gap:10px;
  }
  header .dot{width:10px;height:10px;border-radius:50%;background:var(--neon);box-shadow:0 0 10px var(--neon)}
  header h1{font-size:1.05rem;letter-spacing:1px;background:linear-gradient(135deg,var(--neon),var(--violet));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
  header .status{margin-left:auto;font-size:.7rem;color:#888}
  .toolbar{display:flex;gap:8px;padding:8px 12px;background:var(--panel);border-bottom:1px solid #2a2a4e}
  .toolbar button{
    flex:1; background:#1a1a3e; color:var(--txt); border:1px solid #2a2a4e;
    border-radius:10px; padding:8px; font-size:.8rem; font-weight:600;
  }
  .toolbar button.active{background:var(--violet); border-color:var(--violet); color:#fff}
  #log{flex:1; overflow-y:auto; padding:12px; display:flex; flex-direction:column; gap:10px}
  .msg{max-width:85%; padding:10px 12px; border-radius:14px; font-size:.9rem; line-height:1.35; word-break:break-word}
  .msg.user{align-self:flex-end; background:linear-gradient(135deg,#7b2ff7,#4a1f9e); color:#fff; border-bottom-right-radius:4px}
  .msg.ai{align-self:flex-start; background:var(--panel); border:1px solid #2a2a4e; border-bottom-left-radius:4px}
  .msg.alert{align-self:center; background:#2a0a0a; border:1px solid var(--warn); color:#ff8888; font-size:.8rem; max-width:95%; text-align:center}
  .msg .tag{display:block;font-size:.65rem;opacity:.7;margin-bottom:4px}
  .composer{display:flex; gap:8px; padding:10px 12px; background:var(--panel); border-top:1px solid #2a2a4e}
  .composer input{
    flex:1; background:#0d0d20; border:1px solid #2a2a4e; border-radius:12px;
    padding:12px 14px; color:#fff; font-size:1rem;
  }
  .composer input:focus{outline:none;border-color:var(--neon);box-shadow:0 0 0 2px rgba(0,212,255,.2)}
  .composer button{background:var(--neon); color:#0a0a16; border:none; border-radius:12px; padding:0 18px; font-weight:800; font-size:1.1rem}
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.85);display:flex;align-items:center;justify-content:center;padding:20px;z-index:10}
  .modal .box{background:var(--panel);border:1px solid #2a2a4e;border-radius:16px;padding:20px;width:100%;max-width:320px}
  .modal h2{font-size:1rem;color:var(--neon);margin-bottom:12px}
  .modal input{width:100%;background:#0d0d20;border:1px solid #2a2a4e;border-radius:10px;padding:12px;color:#fff;margin-bottom:14px}
  .modal button{width:100%;background:var(--neon);color:#0a0a16;border:none;border-radius:10px;padding:12px;font-weight:800}
  .hidden{display:none}
</style>
</head>
<body>
<header>
  <span class="dot" id="netDot"></span>
  <h1>AMEAURA · PRIVATE MESH</h1>
  <span class="status" id="netStatus">conectando…</span>
</header>

<div class="toolbar">
  <button id="modeBtn">🧠 AURA</button>
  <button id="memBtn">🧠 Memoria</button>
</div>

<div id="log"></div>

<div class="composer">
  <input id="input" placeholder="Mensaje privado a AURA…" autocomplete="off"/>
  <button id="send">➤</button>
</div>

<div class="modal" id="keyModal">
  <div class="box">
    <h2>🔐 Clave de la Mesh</h2>
    <input id="keyInput" placeholder="X-Mesh-Key" type="password"/>
    <button id="keyOk">Entrar a la Red</button>
  </div>
</div>

<script>
(function(){
  const log = document.getElementById('log');
  const input = document.getElementById('input');
  const send = document.getElementById('send');
  const netStatus = document.getElementById('netStatus');
  const netDot = document.getElementById('netDot');
  const modeBtn = document.getElementById('modeBtn');
  const memBtn = document.getElementById('memBtn');
  const keyModal = document.getElementById('keyModal');
  const keyInput = document.getElementById('keyInput');
  const keyOk = document.getElementById('keyOk');

  let ws = null;
  let meshKey = localStorage.getItem('aura_mesh_key') || '';
  let freeMode = false;
  let reconnectTimer = null;

  function addMsg(cls, html){
    const d = document.createElement('div');
    d.className = 'msg ' + cls;
    d.innerHTML = html;
    log.appendChild(d);
    log.scrollTop = log.scrollHeight;
  }

  function connect(){
    const proto = location.protocol === 'https:' ? 'wss' : 'ws';
    const url = `${proto}://${location.host}/api/mesh/stream?key=${encodeURIComponent(meshKey)}`;
    ws = new WebSocket(url);
    ws.onopen = () => {
      netStatus.textContent = 'en línea';
      netDot.style.background = 'var(--ok)';
      netDot.style.boxShadow = '0 0 10px var(--ok)';
    };
    ws.onmessage = (e) => {
      let m; try { m = JSON.parse(e.data); } catch(_) { return; }
      if(m.type === 'ready'){ addMsg('ai', `<span class="tag">sistema</span>${m.provider} lista.`); }
      else if(m.type === 'reply'){ addMsg('ai', `<span class="tag">${m.tag||''}</span>${(m.text||'').replace(/</g,'&lt;')}`); }
      else if(m.type === 'alert'){ addMsg('alert', `🚨 ${m.text}`); }
      else if(m.type === 'error'){ addMsg('ai', `<span class="tag">error</span>${(m.detail||'')}`); if(m.detail==='unauthorized'){ localStorage.removeItem('aura_mesh_key'); meshKey=''; keyModal.classList.remove('hidden'); } }
    };
    ws.onclose = () => {
      netStatus.textContent = 'desconectado';
      netDot.style.background = 'var(--warn)';
      if(!reconnectTimer) reconnectTimer = setTimeout(() => { reconnectTimer=null; if(meshKey) connect(); }, 3000);
    };
    ws.onerror = () => ws.close();
  }

  function sendMsg(){
    const text = input.value.trim();
    if(!text || !ws || ws.readyState !== 1) return;
    addMsg('user', text.replace(/</g,'&lt;'));
    ws.send(JSON.stringify({ prompt: text, free_mode: freeMode }));
    input.value = '';
  }

  send.addEventListener('click', sendMsg);
  input.addEventListener('keydown', e => { if(e.key === 'Enter') sendMsg(); });

  modeBtn.addEventListener('click', () => {
    freeMode = !freeMode;
    modeBtn.classList.toggle('active', freeMode);
    modeBtn.textContent = freeMode ? '🔓 Libre' : '🧠 AURA';
  });

  memBtn.addEventListener('click', async () => {
    try {
      const data = await fetch('/api/memory?limit=20').then(r => r.json());
      const ws_mem = (data.memories || []).filter(x => /VISION|WORKSPACE/.test(x.kind || ''));
      if(!ws_mem.length){ addMsg('ai', '<span class="tag">memoria</span>Sin recuerdos [VISION]/[WORKSPACE] aún.'); return; }
      let out = '🧠 Recuerdos de la Red:\n';
      ws_mem.slice(0,6).forEach((m,i) => { out += `#${i+1} [${m.kind}] ${String(m.content||'').slice(0,120)}\n`; });
      addMsg('ai', `<span class="tag">memoria</span>${out.replace(/</g,'&lt;')}`);
    } catch(e){ addMsg('ai', `<span class="tag">memoria</span>Error: ${e.message}`); }
  });

  keyOk.addEventListener('click', () => {
    const k = keyInput.value.trim();
    if(!k) return;
    meshKey = k;
    localStorage.setItem('aura_mesh_key', k);
    keyModal.classList.add('hidden');
    connect();
  });

  // Arranque: pedir clave si no hay.
  if(meshKey){ connect(); } else { keyModal.classList.remove('hidden'); }
})();
</script>
</body>
</html>
