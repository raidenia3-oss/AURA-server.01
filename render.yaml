# =====================================================================
# Render Blueprint – AURA Backend (Docker)
# Despliegue automático 24/7 en Render Free Tier
# =====================================================================
# Render usará el Dockerfile multietapa en la raíz del proyecto.
# No necesita buildCommand ni startCommand: el Dockerfile lo define todo.
# =====================================================================

services:
  - type: web
    name: aura-backend
    env: docker
    plan: free
    region: oregon
    branch: main
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: JWT_SECRET_ADMIN
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: BRIDGE_SECRET
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false