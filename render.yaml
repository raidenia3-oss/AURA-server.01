version: "1"
services:
  - type: web
    name: aura-backend
    env: python
    plan: free
    region: oregon
    branch: main
    buildCommand: |
      pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn ame_backend.src.main:app --host 0.0.0.0 --port 8000 --workers 1
    healthCheckPath: /health
    envVars:
      - key: JWT_SECRET_ADMIN
        sync: false
